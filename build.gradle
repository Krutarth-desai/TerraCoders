apply plugin: 'com.android.application'

android {
    namespace 'com.greendrop.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.greendrop.app'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs '../www'
        }
    }
}
